{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>FinTrack - Add Category</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Add Category</h1>
        <p>Create a custom category for your transactions</p>
    </div>

    <div class="card">

        {% if error %}
            <div class="form-errors">
                <p>{{ error }}</p>
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="name">Category Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="e.g. Travel"
                maxlength="100"
                required
            >

            <br><br>

            <button type="submit">
                Add Category
            </button>

        </form>

    </div>

    <div class="actions">
        <a href="/transactions/create-page/">
            Back to Add Transaction
        </a>
    </div>

</div>

</body>
</html>
