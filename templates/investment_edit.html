{% load static %}

<!DOCTYPE html>
<html>

<head>
    <title>FinTrack - Edit Investment</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Edit Investment</h1>
            <p>Update your investment details</p>
        </div>


        <div class="card">

            {% if errors %}
                <div class="form-errors">

                    {% for field, messages in errors.items %}

                        {% for message in messages %}

                            <p>
                                {{ field|title }}: {{ message }}
                            </p>

                        {% endfor %}

                    {% endfor %}

                </div>
            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <label>Stock Symbol</label>

                <input
                    type="text"
                    name="symbol"
                    value="{{ investment.symbol }}"
                    required
                >

                <br><br>


                <label>Quantity</label>

                <input
                    type="number"
                    name="quantity"
                    step="0.0001"
                    min="0.0001"
                    value="{{ investment.quantity }}"
                    required
                >

                <br><br>


                <label>Buy Price</label>

                <input
                    type="number"
                    name="buy_price"
                    step="0.01"
                    min="0.01"
                    value="{{ investment.buy_price }}"
                    required
                >

                <br><br>


                <button type="submit">
                    Update Investment
                </button>

            </form>

        </div>


        <div class="actions">

            <a href="/investments-page/">
                Cancel
            </a>

        </div>

    </div>

</body>

</html>
